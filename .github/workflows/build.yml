name: Build ReSukiSU manager (matches kernel, with ksud)

on:
  workflow_dispatch:

env:
  RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
  RESUKISU_COMMIT: d5e9e025b8b49155f8014684d64c91742b465f65
  RUST_TOOLCHAIN: nightly-2026-09-23
  NDK_VERSION: "27.0.12077973"

jobs:
  manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Fetch ReSukiSU (pinned, full history for versionCode)
        run: |
          mkdir ReSukiSU && cd ReSukiSU
          git init -q
          git remote add origin "$RESUKISU_REPO"
          git fetch -q --filter=blob:none origin "$RESUKISU_COMMIT"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0 ndk;27.0.12077973"

      - name: Install Rust nightly toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rust-src
          rustup default "$RUST_TOOLCHAIN"

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Verify NDK toolchain exists
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          ls "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep aarch64-linux-android26-clang

      - name: Build ksud for arm64-v8a (primary target for Redmi 8 / olive)
        working-directory: ReSukiSU/userspace/ksud
        run: |
          NDK_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android26-clang"
          cargo build --target aarch64-linux-android --release

      - name: Build ksud for armeabi-v7a
        working-directory: ReSukiSU/userspace/ksud
        run: |
          NDK_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_armv7_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi26-clang"
          export CXX_armv7_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi26-clang++"
          export AR_armv7_linux_androideabi="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi26-clang"
          cargo build --target armv7-linux-androideabi --release

      - name: Build ksud for x86_64
        working-directory: ReSukiSU/userspace/ksud
        run: |
          NDK_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_x86_64_linux_android="$NDK_BIN/x86_64-linux-android26-clang"
          export CXX_x86_64_linux_android="$NDK_BIN/x86_64-linux-android26-clang++"
          export AR_x86_64_linux_android="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android26-clang"
          cargo build --target x86_64-linux-android --release

      - name: Place ksud binaries as libksud.so in jniLibs
        working-directory: ReSukiSU
        run: |
          mkdir -p manager/app/src/main/jniLibs/arm64-v8a
          mkdir -p manager/app/src/main/jniLibs/armeabi-v7a
          mkdir -p manager/app/src/main/jniLibs/x86_64
          cp userspace/ksud/target/aarch64-linux-android/release/ksud \
             manager/app/src/main/jniLibs/arm64-v8a/libksud.so
          cp userspace/ksud/target/armv7-linux-androideabi/release/ksud \
             manager/app/src/main/jniLibs/armeabi-v7a/libksud.so
          cp userspace/ksud/target/x86_64-linux-android/release/ksud \
             manager/app/src/main/jniLibs/x86_64/libksud.so
          echo "ksud binaries placed:"
          find manager/app/src/main/jniLibs -name "libksud.so"

      - name: Build manager APK
        working-directory: ReSukiSU/manager
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify libksud.so is inside the built APK
        working-directory: ReSukiSU/manager
        run: |
          APK=$(find . -name "*universal*release*.apk" -path "*/release/*" | head -1)
          test -n "$APK" || { echo "::error::no universal release APK found"; exit 1; }
          echo "APK_PATH=$(readlink -f "$APK")" >> "$GITHUB_ENV"
          echo "Checking for libksud.so inside APK:"
          unzip -l "$APK" | grep -i ksud || { echo "::error::libksud.so missing from APK!"; exit 1; }

      - name: Check versionCode matches kernel driver
        run: |
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK_PATH" > /tmp/badging.txt
          cat /tmp/badging.txt
          grep -q "versionCode='35252'" /tmp/badging.txt || echo "::warning::versionCode differs from expected 35252"

      - name: Re-sign with own keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > ks.jks
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -p -f 4 "$APK_PATH" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --out manager-signed.apk aligned.apk
          "$BT/apksigner" verify --print-certs manager-signed.apk
          sha256sum manager-signed.apk > manager-signed.apk.sha256
          cat manager-signed.apk.sha256

      - name: Upload result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-manager-signed
          path: |
            manager-signed.apk
            manager-signed.apk.sha256

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manager-build-log
          path: ReSukiSU/manager/**/build/outputs/logs/*
          if-no-files-found: ignore
