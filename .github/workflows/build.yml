# Build the ReSukiSU manager APK from the exact same commit as the kernel driver,
# so manager versionCode/SUSFS lib always matches kernel_msm-4.19 (olive/SDM439).
# Companion to "Build Redmi 8 kernel (ReSukiSU + SUSFS full fixed)" — keep
# RESUKISU_COMMIT identical between the two workflows.
name: Build ReSukiSU manager (matches kernel)

on:
  workflow_dispatch:

env:
  RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
  RESUKISU_COMMIT: d5e9e025b8b49155f8014684d64c91742b465f65

jobs:
  manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch ReSukiSU (pinned, full history for versionCode)
        run: |
          mkdir ReSukiSU && cd ReSukiSU
          git init -q
          git remote add origin "$RESUKISU_REPO"
          git fetch -q --filter=blob:none origin "$RESUKISU_COMMIT"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0"

      - name: Build manager APK
        working-directory: ReSukiSU/manager
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate built APK
        working-directory: ReSukiSU/manager
        run: |
          echo "All APKs produced:"
          find . -name "*.apk" -path "*/release/*"
          APK=$(find . -name "*universal*release*.apk" -path "*/release/*" | head -1)
          test -n "$APK" || { echo "::error::no universal release APK found under app/build/outputs/apk/release"; find . -name "*.apk"; exit 1; }
          echo "APK_PATH=$(readlink -f "$APK")" >> "$GITHUB_ENV"
          echo "Found: $APK"

      - name: Check versionCode matches kernel's SUSFS driver
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt"
