# Build the ReSukiSU manager APK from the exact same commit as the kernel driver,
# so manager versionCode/SUSFS lib always matches kernel_msm-4.19 (olive/SDM439).
# Companion to "Build Redmi 8 kernel (ReSukiSU + SUSFS full fixed)" — keep
# RESUKISU_COMMIT identical between the two workflows.
name: Build ReSukiSU manager (matches kernel)

on:
  workflow_dispatch:

env:
  RESUKISU_REPO: https://github.com/ReSukiSU/ReSukiSU.git
  RESUKISU_COMMIT: d5e9e025b8b49155f8014684d64c91742b465f65

jobs:
  manager:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Fetch ReSukiSU (pinned, full history for versionCode)
        run: |
          mkdir ReSukiSU && cd ReSukiSU
          git init -q
          git remote add origin "$RESUKISU_REPO"
          git fetch -q --filter=blob:none origin "$RESUKISU_COMMIT"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;34.0.0"

      - name: Build manager APK
        working-directory: ReSukiSU/manager
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Check versionCode matches kernel's SUSFS driver
        working-directory: ReSukiSU/manager
        run: |
          APK=$(find . -name '*release*unsigned*.apk' | head -1)
          test -n "$APK" || { echo "::error::no unsigned release APK produced"; exit 1; }
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='35252'" /tmp/badging.txt || \
            echo "::warning::versionCode differs from expected 35252 — check ReSukiSU commit history length matches kernel build"

      - name: Sign with own keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > ks.jks
          APK=$(find ReSukiSU/manager -name '*release*unsigned*.apk' | head -1)
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass env:KS_PASS \
            --ks-key-alias "$KEY_ALIAS" --out manager-signed.apk aligned.apk
          "$BT/apksigner" verify manager-signed.apk
          sha256sum manager-signed.apk | tee manager-signed.apk.sha256

      - name: Upload result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-manager-signed
          path: |
            manager-signed.apk
            manager-signed.apk.sha256

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: manager-build-log
          path: ReSukiSU/manager/**/build/outputs/logs/*
          if-no-files-found: ignore
